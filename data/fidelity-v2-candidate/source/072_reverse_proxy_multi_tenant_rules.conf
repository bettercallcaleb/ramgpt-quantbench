# Multi-tenant reverse proxy policy
# Syntax: dotted.key = value
# Lists use JSON arrays. Regex values are slash-delimited.

proxy.version = 4
proxy.instance = edge-east-02
proxy.listen = ["0.0.0.0:443", "[::]:443"]
proxy.http2 = true
proxy.http3 = false
proxy.graceful_shutdown_s = 45
proxy.max_header_bytes = 32768
proxy.request_id.header = X-Request-Id
proxy.request_id.generate_if_missing = true
proxy.forwarded.trust_proxies = ["10.20.0.0/16", "10.21.14.0/24"]
proxy.forwarded.reject_untrusted = true

tls.minimum_version = 1.2
tls.prefer_server_ciphers = true
tls.ocsp_stapling = true
tls.session_tickets = false
tls.default_certificate = certs/fallback.pem
tls.default_key = certs/fallback.key

tenant.alpine.enabled = true
tenant.alpine.hosts = ["api.alpine.example", "portal.alpine.example"]
tenant.alpine.upstream = alpine-pool
tenant.alpine.tls.certificate = certs/alpine/fullchain.pem
tenant.alpine.tls.key = certs/alpine/key.pem
tenant.alpine.headers.add.X-Tenant = alpine
tenant.alpine.headers.remove = ["X-Internal-Debug", "X-Origin-Token"]
tenant.alpine.body.max_bytes = 8388608
tenant.alpine.timeout.connect_ms = 900
tenant.alpine.timeout.first_byte_ms = 12000
tenant.alpine.timeout.total_ms = 30000
tenant.alpine.rate_limit.requests_per_minute = 900
tenant.alpine.rate_limit.burst = 120
tenant.alpine.rate_limit.key = client_ip
tenant.alpine.cors.allowed_origins = ["https://portal.alpine.example"]
tenant.alpine.cors.allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
tenant.alpine.cors.allow_credentials = true
tenant.alpine.paths./health.auth = none
tenant.alpine.paths./health.cache = no_store
tenant.alpine.paths./v1/reports.auth = oidc
tenant.alpine.paths./v1/reports.rate_limit.requests_per_minute = 120
tenant.alpine.paths./v1/uploads.auth = oidc
tenant.alpine.paths./v1/uploads.body.max_bytes = 52428800

tenant.boreal.enabled = true
tenant.boreal.hosts = ["service.boreal.example"]
tenant.boreal.upstream = boreal-pool
tenant.boreal.tls.certificate = certs/boreal/fullchain.pem
tenant.boreal.tls.key = certs/boreal/key.pem
tenant.boreal.headers.add.X-Tenant = boreal
tenant.boreal.headers.add.X-Proxy-Region = east
tenant.boreal.headers.remove = ["Server", "X-Powered-By"]
tenant.boreal.body.max_bytes = 2097152
tenant.boreal.timeout.connect_ms = 700
tenant.boreal.timeout.first_byte_ms = 5000
tenant.boreal.timeout.total_ms = 15000
tenant.boreal.rate_limit.requests_per_minute = 2400
tenant.boreal.rate_limit.burst = 300
tenant.boreal.rate_limit.key = jwt_sub
tenant.boreal.cors.allowed_origins = ["https://console.boreal.example", "https://ops.boreal.example"]
tenant.boreal.cors.allowed_methods = ["GET", "POST", "PATCH", "OPTIONS"]
tenant.boreal.cors.allow_credentials = true
tenant.boreal.paths./metrics.auth = mtls
tenant.boreal.paths./metrics.source_cidrs = ["10.40.0.0/16"]
tenant.boreal.paths./admin.auth = oidc
tenant.boreal.paths./admin.required_claim.role = administrator
tenant.boreal.paths./admin.rate_limit.requests_per_minute = 60

tenant.cedar.enabled = true
tenant.cedar.hosts = ["public.cedar.example", "files.cedar.example"]
tenant.cedar.upstream = cedar-pool
tenant.cedar.tls.certificate = certs/cedar/fullchain.pem
tenant.cedar.tls.key = certs/cedar/key.pem
tenant.cedar.headers.add.X-Tenant = cedar
tenant.cedar.headers.add.Content-Security-Policy = "default-src 'self'"
tenant.cedar.body.max_bytes = 104857600
tenant.cedar.timeout.connect_ms = 1200
tenant.cedar.timeout.first_byte_ms = 20000
tenant.cedar.timeout.total_ms = 90000
tenant.cedar.rate_limit.requests_per_minute = 600
tenant.cedar.rate_limit.burst = 80
tenant.cedar.rate_limit.key = client_ip
tenant.cedar.paths./assets.auth = none
tenant.cedar.paths./assets.cache = public_1h
tenant.cedar.paths./download.auth = signed_url
tenant.cedar.paths./download.range_requests = true
tenant.cedar.paths./upload.auth = oidc
tenant.cedar.paths./upload.required_claim.scope = file.write

upstream.alpine-pool.targets = ["10.50.1.11:8080", "10.50.1.12:8080", "10.50.1.13:8080"]
upstream.alpine-pool.algorithm = least_requests
upstream.alpine-pool.health.path = /internal/ready
upstream.alpine-pool.health.interval_s = 5
upstream.alpine-pool.health.failure_threshold = 3
upstream.alpine-pool.health.success_threshold = 2
upstream.alpine-pool.keepalive = 64

upstream.boreal-pool.targets = ["10.50.2.21:9000", "10.50.2.22:9000"]
upstream.boreal-pool.algorithm = round_robin
upstream.boreal-pool.health.path = /readyz
upstream.boreal-pool.health.interval_s = 10
upstream.boreal-pool.health.failure_threshold = 2
upstream.boreal-pool.health.success_threshold = 2
upstream.boreal-pool.keepalive = 128

upstream.cedar-pool.targets = ["10.50.3.31:7000", "10.50.3.32:7000", "10.50.3.33:7000", "10.50.3.34:7000"]
upstream.cedar-pool.algorithm = hash_path
upstream.cedar-pool.health.path = /health
upstream.cedar-pool.health.interval_s = 8
upstream.cedar-pool.health.failure_threshold = 4
upstream.cedar-pool.health.success_threshold = 2
upstream.cedar-pool.keepalive = 32

auth.oidc.issuer = https://login.identity.example/
auth.oidc.audience = edge-services
auth.oidc.jwks_cache_s = 3600
auth.oidc.clock_skew_s = 45
auth.mtls.ca_bundle = trust/internal-ca.pem
auth.mtls.require_verified_client = true
auth.signed_url.hmac_key_ref = secret://proxy/signed-url-hmac
auth.signed_url.max_ttl_s = 900

observability.access_log.enabled = true
observability.access_log.format = json
observability.access_log.fields = ["timestamp","request_id","tenant","host","method","path","status","duration_ms","upstream","bytes_out"]
observability.access_log.redact_headers = ["authorization","cookie","x-api-key"]
observability.metrics.enabled = true
observability.metrics.listen = 127.0.0.1:9102
observability.tracing.enabled = true
observability.tracing.sample_ratio = 0.03
observability.tracing.exporter = otlp
observability.tracing.endpoint = http://otel-collector.monitoring:4318

error_pages.400 = errors/400.html
error_pages.403 = errors/403.html
error_pages.404 = errors/404.html
error_pages.429 = errors/429.html
error_pages.500 = errors/500.html
error_pages.502 = errors/502.html
error_pages.503 = errors/503.html

reload.watch_files = true
reload.debounce_ms = 700
reload.validate_before_swap = true
reload.keep_previous_generations = 3
