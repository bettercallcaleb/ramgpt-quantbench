; Environmental sensor firmware profile
; Board family: Aster-STM32L4 rev C
; Values are parsed by the bootloader configuration layer.

[identity]
profile_name = ridge_station_v4
profile_version = 17
hardware_revision = C
device_class = env_multisensor
manufacturing_lot = 26H08
region = CA-ON

[clock]
source = hse
hse_hz = 8000000
system_hz = 80000000
low_power_clock = lse
lse_hz = 32768
clock_failure_fallback = hsi16

[sampling]
base_interval_ms = 1000
burst_interval_ms = 100
burst_duration_s = 30
timestamp_source = rtc
align_to_second = true
max_clock_skew_ms = 75

[channel.temperature]
enabled = true
driver = tmp117
i2c_bus = 1
address_hex = 0x49
units = celsius
oversample = 8
offset = -0.07
valid_min = -55.0
valid_max = 80.0

[channel.humidity]
enabled = true
driver = sht45
i2c_bus = 1
address_hex = 0x44
heater_policy = auto_condensation
heater_max_ms = 200
valid_min = 0.0
valid_max = 100.0

[channel.pressure]
enabled = true
driver = bmp390
i2c_bus = 2
address_hex = 0x77
pressure_oversample = 16
temperature_oversample = 2
iir_filter = 7
valid_min_hpa = 300
valid_max_hpa = 1200

[channel.wind]
enabled = true
driver = pulse_anemometer
gpio_input = PB4
edge = rising
debounce_us = 350
meters_per_pulse = 0.72
calibration_slope = 1.018
calibration_intercept = 0.04

[channel.rain]
enabled = true
driver = tipping_bucket
gpio_input = PA8
edge = falling
debounce_ms = 45
millimeters_per_tip = 0.254
max_rate_mm_h = 400

[storage]
backend = qspi_flash
capacity_bytes = 16777216
record_format = cbor
segment_bytes = 262144
retain_segments = 48
fsync_every_records = 60
low_space_threshold_pct = 12
corruption_policy = quarantine_segment

[network]
primary = lte_m
fallback = lorawan
connection_window_s = 75
upload_batch_records = 300
retry_initial_s = 10
retry_max_s = 900
retry_multiplier = 2.0
jitter_pct = 15

[network.lte]
modem = bg95
uart = 3
baud = 921600
apn = telemetry.private
sim_pin_required = false
psm_enabled = true
edrx_enabled = true
dns_primary = 10.11.0.53

[network.lorawan]
region = US915
join = otaa
subband = 2
adaptive_data_rate = true
confirmed_every_n = 20
max_payload = 180

[tls]
enabled = true
minimum_version = 1.2
server_name = ingest.ridge.example
trust_store = factory_bundle_v6
client_certificate_slot = secure_element_0
allow_expired_for_diagnostics = false

[telemetry]
endpoint = mqtts://ingest.ridge.example:8883
topic_template = station/{device_id}/observations
qos = 1
retain = false
compress = heatshrink
include_diagnostics_every = 900

[power]
source = solar_battery
battery_chemistry = lifepo4
nominal_voltage = 12.8
sleep_between_samples = true
minimum_upload_voltage = 11.8
critical_shutdown_voltage = 10.9
resume_voltage = 12.1
brownout_log = true

[power.solar]
controller = mppt_uart
poll_interval_s = 60
max_charge_current_a = 4.0
temperature_compensation = true

[watchdog]
enabled = true
timeout_ms = 8000
feed_task = supervisor
reset_counter_persist = true
safe_mode_after_resets = 3
reset_window_s = 600

[diagnostics]
serial_console = enabled_when_jumper
log_level = info
ring_log_records = 512
include_stack_watermark = true
include_heap_minimum = true
sensor_raw_samples = false

[calibration]
schema = 2
signed_blob_required = true
factory_blob = cal_factory_26H08.bin
field_blob = cal_field_active.bin
field_blob_fallback = factory
reject_if_crc_invalid = true

[update]
method = dual_bank_ota
signature = ed25519
manifest_url = https://fw.ridge.example/releases/stable.json
channel = stable
check_interval_h = 24
install_window = 02:00-04:00
minimum_battery_voltage = 12.2
rollback_if_boot_failures = 2

[safety]
sensor_fault_after_consecutive_invalid = 5
network_failure_does_not_stop_logging = true
config_signature_required = true
factory_reset_requires_button_hold_s = 12
debug_unlock_timeout_s = 600
